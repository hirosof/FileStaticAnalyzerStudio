server {
    listen 80;

    # /api/* は api サービスへ転送（末尾スラッシュで /api を除去）
    location /api/ {
        proxy_pass http://api:8000/;
        client_max_body_size 100m;  # アップロード制限
    }

    # それ以外は SPA（vue-router 用に index.html へフォールバック）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}