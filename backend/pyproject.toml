[project]
name = "fsas"
version = "0.1.0"
description = ""
authors = [
    {name = "hirosof",email = "for-git@mail.hirosof.dev"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "valkey (>=6.1.1,<7.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "nanoid (>=2.0.0,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "lief (>=0.17.6,<0.18.0)",
    "magika (>=1.0.3,<2.0.0)",
    "python-magic (>=0.4.27,<0.5.0)",
    "py-tlsh (>=5.0.0,<6.0.0)",
    "ppdeep (>=20260221,<20260222)",
    "lnkparse3 (>=1.6.0,<2.0.0)",
    "oletools (>=0.60.2,<0.61.0)",
    "dotnetfile (>=0.2.10,<0.3.0)",
]

[tool.poetry]
packages = [{include = "fsas", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
