[project]
name = "fsas"
version = "0.1.0"
description = ""
authors = [
    {name = "hirosof",email = "for-git@mail.hirosof.dev"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "valkey (>=6.1.1,<7.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "nanoid (>=2.0.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "fsas", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
